<header class="runhead">
  <a class="mark" href="{{ BASE_PATH }}" aria-label="{{ SITE.name }}, home">
    <svg viewBox="0 0 52 30" aria-hidden="true">
      <path d="M9 13 C 11 1, 41 1, 43 13" fill="none" stroke="#B3301C" stroke-width="1.3"/>
      <path d="M40.2 10.6 L43 14.2 L45.2 10.2 Z" fill="#B3301C"/>
      <text x="9" y="28" text-anchor="middle" font-family="Libertinus Serif, serif" font-size="13" font-weight="600" fill="#1C1A17">NL</text>
      <text x="43" y="28" text-anchor="middle" font-family="Libertinus Serif, serif" font-size="13" font-weight="600" fill="#1C1A17">DB</text>
    </svg>
    · <span class="sc">{{ SITE.name | lower }} <span class="city">· {{ SITE.city | lower }}</span><span class="sc">· 16-18 June</span></span>
  </a>
  <br>
  <nav aria-label="Main">
    {% for item in SITE.navigation %}
      <a href="{{ BASE_PATH }}{{ item.path }}"{% if current_path == item.path %} aria-current="page"{% endif %}>{{ item.text }}</a>
    {% endfor %}
  </nav>
</header>
